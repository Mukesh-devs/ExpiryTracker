name: Android Kotlin CI Pipeline

# Triggers the workflow on push or pull requests targeting the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test App
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository source code
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Set up Java Development Kit (JDK 17 is required for modern Android Gradle Plugin versions)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Step 3: Cache Gradle dependencies to accelerate future pipeline runs
    - name: Setup Gradle Cache
      uses: gradle/actions/setup-gradle@v3

    # Step 4: Ensure the Gradle wrapper script has executable permissions
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    # Step 4.5: Create mock google-services.json for CI
    - name: Create mock google-services.json
      run: |
        echo '{
          "project_info": {
            "project_number": "1234567890",
            "project_id": "mock-project"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:1234567890:android:abcdef",
                "android_client_info": {
                  "package_name": "com.dev.expirytracker"
                }
              },
              "oauth_client": [],
              "api_key": [
                {
                  "current_key": "mock-api-key"
                }
              ],
              "services": {
                "appinvite_service": { "other_platform_oauth_client": [] }
              }
            }
          ],
          "configuration_version": "1"
        }' > app/google-services.json

    # Step 5: Run Android Lint to perform static code analysis
    - name: Run Code Lint Check
      run: ./gradlew lintDebug

    # Step 6: Execute all Kotlin unit tests
    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    # Step 7: Assemble the executable debug APK file
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # Step 8: Upload the generated APK file so you can download it from GitHub
    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    # Step 9: Assemble the release APK file
    - name: Build Release APK
      run: ./gradlew assembleRelease

    # Step 10: Create GitHub Release and Upload APK
    - name: Create Release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: app/build/outputs/apk/release/app-release-unsigned.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
