name: Android Kotlin CI Pipeline

# Triggers the workflow on push or pull requests targeting the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test App
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository source code
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Set up Java Development Kit (JDK 17 is required for modern Android Gradle Plugin versions)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Step 3: Cache Gradle dependencies to accelerate future pipeline runs
    - name: Setup Gradle Cache
      uses: gradle/actions/setup-gradle@v3

    # Step 4: Ensure the Gradle wrapper script has executable permissions
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    # Step 5: Run Android Lint to perform static code analysis
    - name: Run Code Lint Check
      run: ./gradlew lintDebug

    # Step 6: Execute all Kotlin unit tests
    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    # Step 7: Assemble the executable debug APK file
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # Step 8: Upload the generated APK file so you can download it from GitHub
    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
